schema_version: "1.0"
workflow:
  id: "speckit"
  name: "Local Spec-Driven Development Cycle"
  version: "1.1.0"
  author: "Ego Hygiene"
  description: "Runs specify -> plan -> tasks -> implement with human review gates"

requires:
  speckit_version: ">=0.8.5"
  integrations:
    any: ["opencode"]

inputs:
  spec:
    type: string
    required: true
    prompt: "Describe what you want to build"
  integration:
    type: string
    default: "opencode"
    enum: ["opencode"]
  scope:
    type: string
    default: "full"
    enum: ["full", "backend-only", "frontend-only", "tool-only", "knowledge-only"]

steps:
  - id: specify
    command: speckit.specify
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-spec
    type: gate
    message: "Review the generated specification before planning."
    options: [approve, reject]
    on_reject: abort

  - id: plan
    command: speckit.plan
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-plan
    type: gate
    message: "Review the implementation plan before generating tasks."
    options: [approve, reject]
    on_reject: abort

  - id: tasks
    command: speckit.tasks
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-tasks
    type: gate
    message: "Review task scope, dependencies, and verification before implementation."
    options: [approve, reject]
    on_reject: abort

  - id: implement
    command: speckit.implement
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"
