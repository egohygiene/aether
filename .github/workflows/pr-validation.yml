name: PR validation

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      RUN_REPORT_DIR: .artifacts/pr-validation
      AETHER_E2E_REPORT_DIR: .artifacts/pr-validation/consumer-installation
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install deterministic tooling
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --requirement requirements-dev.lock

      - name: Run deterministic validation suite
        run: |
          set -euo pipefail
          mkdir -p "${RUN_REPORT_DIR}"
          ./aether distribution build --output-directory "dist" | tee "${RUN_REPORT_DIR}/distribution-build.txt"
          ./aether distribution build --output-directory "dist" --check | tee "${RUN_REPORT_DIR}/distribution-check.txt"
          ./aether validate --format "text" | tee "${RUN_REPORT_DIR}/validate.txt"
          ./aether validate --shell --format "text" | tee "${RUN_REPORT_DIR}/shell.txt"
          ./aether validate --staging --strict-staging --format "text" | tee "${RUN_REPORT_DIR}/staging.txt"
          ./aether catalog generate --check | tee "${RUN_REPORT_DIR}/catalog-generate.txt"
          python3 catalog/validate_catalog.py | tee "${RUN_REPORT_DIR}/catalog-schema.txt"
          ./aether eval run --mode "deterministic" --format "text" | tee "${RUN_REPORT_DIR}/evals.txt"
          ./aether test | tee "${RUN_REPORT_DIR}/tests.txt"

      - name: Verify two-build reproducibility
        run: |
          set -euo pipefail
          rm -rf dist /tmp/aether-dist-pass-1 /tmp/aether-dist-pass-2
          ./aether distribution build --output-directory "dist" | tee "${RUN_REPORT_DIR}/distribution-build-pass-1.txt"
          cp -R dist /tmp/aether-dist-pass-1
          rm -rf dist
          ./aether distribution build --output-directory "dist" | tee "${RUN_REPORT_DIR}/distribution-build-pass-2.txt"
          cp -R dist /tmp/aether-dist-pass-2
          diff -ru /tmp/aether-dist-pass-1 /tmp/aether-dist-pass-2 | tee "${RUN_REPORT_DIR}/distribution-reproducibility.diff"

      - name: Validate publish payload without publishing
        run: |
          set -euo pipefail
          gh skill publish "dist" --dry-run | tee "${RUN_REPORT_DIR}/gh-skill-publish-dry-run.txt"

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr-validation-diagnostics
          path: .artifacts/pr-validation/
          if-no-files-found: error
