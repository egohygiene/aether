name: Repair first-party catalog

on:
  push:
    branches:
      - feat/39-provider-neutral-projections
    paths:
      - .github/workflows/repair-catalog.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feat/39-provider-neutral-projections

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install deterministic tooling
        run: >-
          python -m pip install
          --disable-pip-version-check
          --requirement requirements-dev.lock

      - name: Regenerate and commit only the canonical catalog
        shell: bash
        run: |
          set -euo pipefail
          ./aether catalog generate
          git add "catalog/first-party/catalog.v1.json"
          if git diff --cached --quiet; then
            printf '%s\n' "Catalog is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --message "fix(catalog): synchronize architecture specifications"
          git push origin "HEAD:${GITHUB_REF_NAME}"
