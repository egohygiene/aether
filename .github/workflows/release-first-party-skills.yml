name: Release first-party skills

on:
  pull_request:
    paths:
      - .github/workflows/release-first-party-skills.yml
      - catalog/release_source.py
      - library/organization/skills/build-release-artifacts.py
      - tests/test_release_artifacts.py
      - tests/test_release_workflow.py
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing repository tag to validate and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-first-party-skills-${{ github.event.pull_request.number || github.event.inputs.release_tag }}
  cancel-in-progress: false

jobs:
  qualify-source:
    name: Qualify release source without publication
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tooling source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install deterministic tooling
        run: python -m pip install --disable-pip-version-check --requirement requirements-dev.lock
      - name: Qualify exact payload, metadata and native Git source controls
        run: python3 -m unittest tests.test_release_artifacts tests.test_release_workflow -v

  validate-release:
    if: github.event_name == 'workflow_dispatch'
    needs: qualify-source
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    outputs:
      release_tag: ${{ steps.release-context.outputs.release_tag }}
      release_ref: ${{ steps.release-context.outputs.release_ref }}
      release_commit: ${{ steps.source-context.outputs.release_commit }}
    env:
      RUN_REPORT_DIR: .artifacts/release-validation
      AETHER_E2E_REPORT_DIR: .artifacts/release-validation/consumer-installation
      AETHER_E2E_REMOTE_REPOSITORY: egohygiene/aether
    steps:
      - name: Resolve validated release tag
        id: release-context
        env:
          INPUT_RELEASE_TAG: ${{ github.event.inputs.release_tag || '' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "${REF_NAME}" != "${DEFAULT_BRANCH}" ]; then
            echo "Dispatch this workflow from the default branch (${DEFAULT_BRANCH})." >&2
            exit 1
          fi
          release_tag="${INPUT_RELEASE_TAG}"
          if [[ ! "${release_tag}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must match exact v<major>.<minor>.<patch>." >&2
            exit 1
          fi
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "release_ref=refs/tags/${release_tag}" >> "${GITHUB_OUTPUT}"

      - name: Check out tagged commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.release-context.outputs.release_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require tag on default-branch history and resolve exact source
        id: source-context
        env:
          RELEASE_TAG: ${{ steps.release-context.outputs.release_tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          python3 -m catalog.release_source --release-tag "${RELEASE_TAG}" \
            --default-branch "${DEFAULT_BRANCH}" > "${RUNNER_TEMP}/release-source.json"
          release_commit="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["commit_sha"])' "${RUNNER_TEMP}/release-source.json")"
          echo "release_commit=${release_commit}" >> "${GITHUB_OUTPUT}"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install deterministic tooling
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --requirement requirements-dev.lock

      - name: Rebuild and validate tagged commit
        env:
          RELEASE_TAG: ${{ steps.release-context.outputs.release_tag }}
          RELEASE_COMMIT: ${{ steps.source-context.outputs.release_commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export AETHER_E2E_REMOTE_COMMIT="${RELEASE_COMMIT}"
          mkdir -p "${RUN_REPORT_DIR}"
          rm -rf dist
          ./aether distribution build --output-directory "dist" | tee "${RUN_REPORT_DIR}/distribution-build.txt"
          ./aether distribution build --output-directory "dist" --check | tee "${RUN_REPORT_DIR}/distribution-check.txt"
          ./aether validate --format "text" | tee "${RUN_REPORT_DIR}/validate.txt"
          ./aether validate --shell --format "text" | tee "${RUN_REPORT_DIR}/shell.txt"
          ./aether catalog generate --check | tee "${RUN_REPORT_DIR}/catalog-generate.txt"
          python3 catalog/validate_catalog.py | tee "${RUN_REPORT_DIR}/catalog-schema.txt"
          ./aether eval run --mode "deterministic" --format "text" | tee "${RUN_REPORT_DIR}/evals.txt"
          ./aether test | tee "${RUN_REPORT_DIR}/tests.txt"
          python3 -m catalog.consumer_installation --scope release \
            --remote-repository "${AETHER_E2E_REMOTE_REPOSITORY}" \
            --remote-tag "${RELEASE_TAG}" \
            --remote-commit "${AETHER_E2E_REMOTE_COMMIT}" \
            --output "${AETHER_E2E_REPORT_DIR}" | tee "${RUN_REPORT_DIR}/consumer-qualification.txt"
          python3 library/organization/skills/build-release-artifacts.py \
            --release-tag "${RELEASE_TAG}" \
            --output-directory "dist" \
            --commit-sha "${RELEASE_COMMIT}" \
            --payload-directory "${RUN_REPORT_DIR}/payload" \
            --archive "${RUN_REPORT_DIR}/aether-${RELEASE_TAG}-dist.tar.gz" | tee "${RUN_REPORT_DIR}/release-artifacts.txt"
          RELEASE_TAG_CHECK="${RELEASE_TAG}" python3 - <<'PY' | tee "${RUN_REPORT_DIR}/release-manifest-check.txt"
          import json
          import os
          from pathlib import Path
          manifest = json.loads(Path("dist/release/release-manifest.v1.json").read_text(encoding="utf-8"))
          release_tag = os.environ["RELEASE_TAG_CHECK"]
          if manifest["repository_release_tag"] != release_tag:
              raise SystemExit(f"release manifest tag mismatch: {manifest['repository_release_tag']} != {release_tag}")
          print(f"Release manifest matches {release_tag}")
          PY
          gh skill publish "${RUN_REPORT_DIR}/payload" --dry-run | tee "${RUN_REPORT_DIR}/gh-skill-publish-dry-run.txt"

      - name: Verify release reproducibility
        run: |
          set -euo pipefail
          rm -rf dist /tmp/aether-release-pass-1 /tmp/aether-release-pass-2
          ./aether distribution build --output-directory "dist" | tee "${RUN_REPORT_DIR}/distribution-build-pass-1.txt"
          cp -R dist /tmp/aether-release-pass-1
          rm -rf dist
          ./aether distribution build --output-directory "dist" | tee "${RUN_REPORT_DIR}/distribution-build-pass-2.txt"
          cp -R dist /tmp/aether-release-pass-2
          diff -ru /tmp/aether-release-pass-1 /tmp/aether-release-pass-2 | tee "${RUN_REPORT_DIR}/distribution-reproducibility.diff"

      - name: Retain consumer qualification receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-consumer-qualification
          path: .artifacts/release-validation/consumer-installation/
          if-no-files-found: ignore

      - name: Upload validation diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-validation-diagnostics
          path: .artifacts/release-validation/
          if-no-files-found: error

  publish-release:
    if: github.event_name == 'workflow_dispatch'
    needs: validate-release
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    environment:
      name: first-party-skill-release
    permissions:
      contents: write
      attestations: write
      id-token: write
    env:
      RELEASE_TAG: ${{ needs.validate-release.outputs.release_tag }}
      RELEASE_COMMIT: ${{ needs.validate-release.outputs.release_commit }}
      RUN_REPORT_DIR: .artifacts/release-publication
    steps:
      - name: Check out exact validated commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.RELEASE_COMMIT }}
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse moved tag or changed source before rebuilding
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          python3 -m catalog.release_source --release-tag "${RELEASE_TAG}" \
            --default-branch "${DEFAULT_BRANCH}" --expected-commit "${RELEASE_COMMIT}"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install deterministic tooling
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --requirement requirements-dev.lock

      - name: Rebuild approved release payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "${RUN_REPORT_DIR}"
          rm -rf dist
          ./aether distribution build --output-directory "dist" | tee "${RUN_REPORT_DIR}/distribution-build.txt"
          ./aether distribution build --output-directory "dist" --check | tee "${RUN_REPORT_DIR}/distribution-check.txt"
          ./aether validate --format "text" | tee "${RUN_REPORT_DIR}/validate.txt"
          ./aether catalog generate --check | tee "${RUN_REPORT_DIR}/catalog-generate.txt"
          python3 catalog/validate_catalog.py | tee "${RUN_REPORT_DIR}/catalog-schema.txt"
          ./aether eval run --mode "deterministic" --format "text" | tee "${RUN_REPORT_DIR}/evals.txt"
          ./aether test | tee "${RUN_REPORT_DIR}/tests.txt"
          python3 library/organization/skills/build-release-artifacts.py \
            --release-tag "${RELEASE_TAG}" \
            --output-directory "dist" \
            --commit-sha "${RELEASE_COMMIT}" \
            --payload-directory "${RUN_REPORT_DIR}/payload" \
            --archive "${RUN_REPORT_DIR}/aether-${RELEASE_TAG}-dist.tar.gz" | tee "${RUN_REPORT_DIR}/release-artifacts.txt"
          gh skill publish "${RUN_REPORT_DIR}/payload" --dry-run | tee "${RUN_REPORT_DIR}/gh-skill-publish-dry-run.txt"

      - name: Publish a new GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          python3 -m catalog.release_source --release-tag "${RELEASE_TAG}" \
            --default-branch "${DEFAULT_BRANCH}" --expected-commit "${RELEASE_COMMIT}"
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; immutable release publication refuses to continue." >&2
            exit 1
          fi
          gh skill publish "${RUN_REPORT_DIR}/payload" --tag "${RELEASE_TAG}" | tee "${RUN_REPORT_DIR}/publish.txt"

      - name: Attach release metadata assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "${RELEASE_TAG}" \
            "${RUN_REPORT_DIR}/payload/release/release-manifest.v1.json" \
            "${RUN_REPORT_DIR}/payload/release/checksums.txt" \
            "${RUN_REPORT_DIR}/payload/release/release-provenance.v1.json" \
            "${RUN_REPORT_DIR}/payload/release/LICENSE.notices.txt" \
            "${RUN_REPORT_DIR}/payload/release/release-notes.md" \
            "${RUN_REPORT_DIR}/aether-${RELEASE_TAG}-dist.tar.gz" | tee "${RUN_REPORT_DIR}/release-upload.txt"

      - name: Attest release archive provenance
        if: success()
        continue-on-error: true
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: ${{ env.RUN_REPORT_DIR }}/aether-${{ env.RELEASE_TAG }}-dist.tar.gz

      - name: Upload release bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: first-party-skill-release-bundle-${{ env.RELEASE_TAG }}
          path: |
            dist/
            .artifacts/release-publication/
          if-no-files-found: error
